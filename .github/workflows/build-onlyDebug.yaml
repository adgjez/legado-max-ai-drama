name: Build Debug APK

on:
  # 新公开仓库：推送到 main 即触发 Debug APK 构建验证
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一个分支连续 push 时，取消旧任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          # 在 Linux 环境下执行，精准打包 AppMaxDebug 变体，并跳过 Google Services 检查
          ./gradlew assembleAppMaxDebug -x processAppSDebugGoogleServices --parallel --daemon

      - name: Report APK Size Distribution
        run: |
          python3 - <<'EOF'
          import zipfile, collections, os
          d = 'app/build/outputs/apk/appMax/debug'
          apk = [f for f in os.listdir(d) if f.endswith('.apk')][0]
          p = os.path.join(d, apk)
          fsize = os.path.getsize(p)
          z = zipfile.ZipFile(p)
          total = sum(i.file_size for i in z.infolist())
          print(f'APK={apk} file_bytes={fsize} file_MiB={fsize/1048576:.1f} uncompressed_MiB={total/1048576:.1f}')
          by_dir = collections.defaultdict(int)
          for i in z.infolist():
              by_dir[i.filename.split('/')[0]] += i.file_size
          print('== By top dir ==')
          for k, v in sorted(by_dir.items(), key=lambda x: -x[1]):
              print(f'{v/1024/1024:6.1f} MiB  {k}')
          libs = [(i.filename, i.file_size) for i in z.infolist() if i.filename.startswith('lib/')]
          abi = collections.defaultdict(int)
          for f, s in libs:
              abi[f.split('/')[1]] += s
          print('== Native libs by ABI ==')
          for k, v in sorted(abi.items(), key=lambda x: -x[1]):
              print(f'{v/1024/1024:6.1f} MiB  lib/{k}')
          print('== Top 15 native libs ==')
          for f, s in sorted(libs, key=lambda x: -x[1])[:15]:
              print(f'{s/1024/1024:6.1f} MiB  {f}')
          print('== DEX ==')
          for i in z.infolist():
              if i.filename.endswith('.dex'):
                  print(f'{i.file_size/1024/1024:6.1f} MiB  {i.filename}')
          print('== Resources by ext (non-lib/dex) ==')
          by_ext = collections.defaultdict(int)
          for i in z.infolist():
              if i.filename.startswith(('lib/', 'classes')) or i.filename.endswith('.dex'):
                  continue
              ext = os.path.splitext(i.filename.split('/')[-1])[1] or '[dir]'
              by_ext[ext] += i.file_size
          for k, v in sorted(by_ext.items(), key=lambda x: -x[1])[:15]:
              print(f'{v/1024/1024:6.1f} MiB  {k}')
          EOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          # 指定打包后的 APK 路径，如果你的输出路径不同请自行修改
          path: app/build/outputs/apk/appMax/debug/*.apk
          retention-days: 7 # 保留 7 天，过期自动清理
